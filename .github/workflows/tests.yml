name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 (macOS system Python) has no build for ubuntu-latest (26.04); pin its image.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (standard library only, no network or licensed data)
        run: python -m unittest discover -s tests -t tests -v
      - name: Demo smoke test
        run: |
          python -m medlite --db "$RUNNER_TEMP/demo.db" init
          python -m medlite --db "$RUNNER_TEMP/demo.db" ask "coumadin and advil" | tee out.txt
          grep -q "warfarin + ibuprofen: MAJOR" out.txt
          python baseline/med.py --db "$RUNNER_TEMP/demo.db" stats
